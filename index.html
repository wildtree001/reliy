<script>
    scaleW = window.innerWidth / 320;
    scaleH = window.innerHeight / 480;
    let resize = document.querySelectorAll('.resize');
    for (let j = 0; j < resize.length; j++) {
        resize[j].style.width = parseInt(resize[j].style.width) * scaleW + 'px';
        resize[j].style.height = parseInt(resize[j].style.height) * scaleH + 'px';
        resize[j].style.top = parseInt(resize[j].style.top) * scaleH + 'px';
        resize[j].style.left = parseInt(resize[j].style.left) * scaleW + 'px';
    }
    let mySwiper = new Swiper('.swiper-container', {
        autoplay: 4000,
        direction: 'vertical',
        mousewheelControl: true,
        loop: false,
        speed: 1200,
        zoom: true,
        pagination: '.swiper-pagination',
        paginationType: 'progress',
        onInit: function (swiper) {
            swiperAnimateCache(swiper);
            swiperAnimate(swiper);
        },
        onSlideChangeEnd: function (swiper) {
            swiperAnimate(swiper);
        },
        onTransitionEnd: function (swiper) {
            swiperAnimate(swiper);
        },

        watchSlidesProgress: true,

        onProgress: function (swiper) {
            for (let i = 0; i < swiper.slides.length; i++) {
                let slide = swiper.slides[i];
                let progress = slide.progress;
                let translate = progress * swiper.height / 4;
                let scale = 1 - Math.min(Math.abs(progress * 0.5), 1), es;
                slide.style.opacity = 1 - Math.min(Math.abs(progress / 2), 0.5);
                es = slide.style;
                es.webkitTransform = es.MsTransform = es.msTransform = es.MozTransform = es.OTransform = es.transform = 'translate3d(0,' + translate + 'px,-' + translate + 'px) scaleY(' + scale + ')';
            }
        },

        onSetTransition: function (swiper, speed) {
            for (let i = 0, es; i < swiper.slides.length; i++) {
                es = swiper.slides[i].style;
                es.webkitTransitionDuration = es.MsTransitionDuration = es.msTransitionDuration = es.MozTransitionDuration = es.OTransitionDuration = es.transitionDuration = speed + 'ms';
            }
        },
    });

    function musicPlay() {
        document.getElementById('music_stop').style.display = 'none';
        document.getElementById('music_play').style.display = '';
        document.getElementById("music_tag").play();
    }

    function musicStop() {
        document.getElementById('music_stop').style.display = '';
        document.getElementById('music_play').style.display = 'none';
        document.getElementById("music_tag").pause();
    }

    function people() {
        fixScroll();
        let submit_people = $('#submit_people');
        submit_people.attr("disabled", true);
        $.ajax({
            //几个参数需要注意一下
            type: "POST",//方法类型
            dataType: "json",//预期服务器返回的数据类型
            url: "/friend",// 提交到后端的url
            data: $('#friendForm').serialize(),
            success: function (data) {
                iakit.toast.showCenter(data.msg);
                submit_people.attr("disabled", false);
            },
            error: function () {
                iakit.toast.showCenter('提交故障，请联系新郎~');
            }
        });
    }

    function fixScroll() {
        let u = navigator.userAgent;
        let isiOS = !!u.match(/\(i[^;]+;( U;)? CPU.+Mac OS X/);
        if (isiOS) {
            window.scrollTo(0, 0);
        }
    }

    const WEDDING_LOCATION = {
        name: '北京市朝阳区婚礼酒店',
        address: '北京市朝阳区建国路88号',
        latitude: 39.9042,
        longitude: 116.4074
    };

    const BLESSING_KEY = 'wedding_blessings';

    function getDefaultBlessings() {
        return [
            {
                name: '张三',
                content: '祝你们新婚快乐，百年好合！愿你们的爱情像钻石一样永恒闪耀！',
                time: '2019-01-01 10:00'
            },
            {
                name: '李四',
                content: '恭喜恭喜！愿你们的生活充满欢声笑语，每一天都是情人节！',
                time: '2019-01-01 10:30'
            },
            {
                name: '王五',
                content: '执子之手，与子偕老。祝福你们永远幸福，相爱一生！',
                time: '2019-01-01 11:00'
            },
            {
                name: '赵六',
                content: '愿你们的爱情如同美酒，越陈越香。祝新婚快乐，早生贵子！',
                time: '2019-01-01 11:30'
            },
            {
                name: '孙七',
                content: '在这美好的日子里，祝你们新婚愉快，幸福美满，永远相爱！',
                time: '2019-01-01 12:00'
            }
        ];
    }

    function getBlessings() {
        let blessings = localStorage.getItem(BLESSING_KEY);
        if (!blessings) {
            blessings = getDefaultBlessings();
            localStorage.setItem(BLESSING_KEY, JSON.stringify(blessings));
            return blessings;
        }
        return JSON.parse(blessings);
    }

    function saveBlessing(blessing) {
        let blessings = getBlessings();
        blessings.unshift(blessing);
        if (blessings.length > 100) {
            blessings = blessings.slice(0, 100);
        }
        localStorage.setItem(BLESSING_KEY, JSON.stringify(blessings));
        return blessings;
    }

    function formatTime(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    function submitBlessing() {
        const nameInput = document.getElementById('blessing_name');
        const contentInput = document.getElementById('blessing_content');
        
        const name = nameInput.value.trim();
        const content = contentInput.value.trim();
        
        if (!name) {
            iakit.toast.showCenter('请输入您的姓名');
            return;
        }
        
        if (!content) {
            iakit.toast.showCenter('请输入祝福内容');
            return;
        }
        
        const blessing = {
            name: name,
            content: content,
            time: formatTime(new Date())
        };
        
        saveBlessing(blessing);
        
        nameInput.value = '';
        contentInput.value = '';
        
        iakit.toast.showCenter('祝福发送成功！');
        
        renderBlessings();
    }

    function renderBlessings() {
        const blessingList = document.getElementById('blessing_list');
        const blessings = getBlessings();
        
        if (blessings.length === 0) {
            blessingList.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">暂无祝福，快来写下第一条祝福吧！</div>';
            return;
        }
        
        let html = '';
        blessings.forEach(blessing => {
            html += `
                <div class="blessing_item">
                    <div class="blessing_name">${escapeHtml(blessing.name)}</div>
                    <div class="blessing_content">${escapeHtml(blessing.content)}</div>
                    <div class="blessing_time">${blessing.time}</div>
                </div>
            `;
        });
        
        if (blessings.length > 3) {
            html += html;
        }
        
        blessingList.innerHTML = html;
        
        startScrollAnimation();
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function startScrollAnimation() {
        const blessingList = document.getElementById('blessing_list');
        const blessingScroll = document.querySelector('.blessing_scroll');
        
        blessingList.classList.remove('scrolling');
        
        setTimeout(() => {
            const listHeight = blessingList.offsetHeight;
            const scrollHeight = blessingScroll.offsetHeight;
            
            if (listHeight > scrollHeight) {
                blessingList.classList.add('scrolling');
            }
        }, 100);
    }

    function openMap() {
        const { latitude, longitude, name, address } = WEDDING_LOCATION;
        
        const mapUrl = `https://uri.amap.com/marker?position=${longitude},${latitude}&name=${encodeURIComponent(name)}&src=wedding_invitation&coordinate=gaode&callnative=0`;
        
        window.open(mapUrl, '_blank');
    }

    function openNavigation() {
        const { latitude, longitude, name, address } = WEDDING_LOCATION;
        
        const u = navigator.userAgent;
        const isAndroid = u.indexOf('Android') > -1 || u.indexOf('Linux') > -1;
        const isIOS = !!u.match(/\(i[^;]+;( U;)? CPU.+Mac OS X/);
        
        let navUrl = '';
        
        if (isIOS) {
            navUrl = `iosamap://navi?sourceApplication=wedding_invitation&poiname=${encodeURIComponent(name)}&lat=${latitude}&lon=${longitude}&dev=1&style=2`;
        } else if (isAndroid) {
            navUrl = `androidamap://navi?sourceApplication=wedding_invitation&poiname=${encodeURIComponent(name)}&lat=${latitude}&lon=${longitude}&dev=1&style=2`;
        }
        
        if (navUrl) {
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = navUrl;
            document.body.appendChild(iframe);
            
            setTimeout(() => {
                document.body.removeChild(iframe);
                const webUrl = `https://uri.amap.com/navigation?to=${longitude},${latitude},${encodeURIComponent(name)}&mode=car&coordinate=gaode&callnative=1`;
                window.open(webUrl, '_blank');
            }, 2000);
        } else {
            const webUrl = `https://uri.amap.com/navigation?to=${longitude},${latitude},${encodeURIComponent(name)}&mode=car&coordinate=gaode&callnative=1`;
            window.open(webUrl, '_blank');
        }
    }

    $(document).ready(function() {
        renderBlessings();

        let musicPlay = document.getElementById("music_tag").play();

        if (musicPlay !== undefined) {
            musicPlay.then(_ => {
                musicPlay.play();
            })
            .catch(error => {

            });
        }
    });
</script>
